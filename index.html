<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/huba-blog-static/images/icons/白猫.png" />

    <!-- ===== 装到主屏后像 App 一样全屏（没有地址栏、没有底部工具栏） =====
         网页在浏览器里永远无法去掉浏览器自己的 UI，只有「添加到主屏幕」以
         standalone 模式启动才能做到真正全屏 —— 这也是「像苹果那种」的唯一途径。
         status-bar-style: black-translucent = 状态栏透明叠在页面上，
         壁纸能一直铺到屏幕最上沿；配合 global.css 的 --safe-top 保证内容不被刘海压住。
         iOS 走 apple-* 系列标签，Android/Chrome 走 manifest.json。 -->
    <link rel="manifest" href="/huba-blog-static/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="胡巴" />
    <link rel="apple-touch-icon" sizes="180x180" href="/huba-blog-static/images/icons/app-icon-180.png" />

    <link rel="preload" as="image" href="/huba-blog-static/images/wallpaper-preview.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/huba-blog-static/images/wallpaper-20260717.png" />
    <!-- viewport-fit=cover：让页面铺满 iPhone 刘海/灵动岛与底部 Home 条区域。
         缺了它，安全区会被浏览器用页面底色（--app-base 深色）填充，
         表现就是上下各有一条深色边条、壁纸铺不满。
         注意：开启后内容会顶到安全区下面，必须配合 global.css 里的
         --safe-top / --safe-bottom 给固定元素和页面容器留白。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="胡巴的个人博客 — 河北金融学院区块链工程本科在读，记录计算机基础、Java 后端与区块链的学习过程、实践经历和问题复盘" />
    <!-- theme-color 只对 Safari 15~18.6 与 Android Chrome 有效；
         Safari 26 起改成了「采样页面元素的 background-color」，见下方 .chrome-tint 说明。
         这里给的是加载瞬间的兜底值，页面脚本就绪后会改成壁纸顶边色。 -->
    <meta name="theme-color" content="#0c0f09" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="胡巴的博客" />
    <meta property="og:description" content="记录学习过程、实践经历与问题复盘" />
    <meta property="og:type" content="website" />
    <title>胡巴的博客</title>

    <!-- 在首次绘制前定好背景与欢迎层状态，杜绝纯色闪烁 -->
    <script>
      (function () {
        var root = document.documentElement;
        var fallbackPreview = '/huba-blog-static/images/wallpaper-preview.webp';

        // query-string 调试开关：?welcome=1 强制重播，?nowelcome=1 强制跳过
        var qs = location.search;
        var forceWelcome = /[?&]welcome=1/.test(qs);
        var skipWelcome = /[?&]nowelcome=1/.test(qs);

        // 只负责“预览层”，--bg-image 由 store 独占，避免旧壁纸覆盖新配置。
        // 分两层：--bg-preview 是本地 6KB 兜底图（永远有效，永远垫底），
        // --bg-preview-custom 是缓存的自定义壁纸（可能加载失败/过慢，失败时露出兜底图）。
        var cached = null;
        try { cached = localStorage.getItem('bgImage'); } catch (e) {}
        root.style.setProperty('--bg-preview', "url('" + fallbackPreview + "')");
        if (cached) root.style.setProperty('--bg-preview-custom', "url('" + cached + "')");

        // 欢迎层是否展示：用 localStorage（跨标签页/刷新都记住），在 <html> 上打标记，
        // 首帧就不渲染，避免底部脚本执行前的闪现
        try {
          if (forceWelcome) localStorage.removeItem('welcome_seen');
          if (skipWelcome || localStorage.getItem('welcome_seen')) {
            root.classList.add('welcome-seen');
          }
        } catch (e) {}

        // 预热两张预览图（有自定义壁纸时两张都拉），让它们尽量赶在首次绘制前就位。
        // 注意：这里不再对外暴露「就绪 Promise」，也不再让任何层等它淡入 ——
        // 淡入会破坏毛玻璃（见上面 body::before 的说明）。
        [fallbackPreview, cached].forEach(function (u) {
          if (!u) return;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = u;
          document.head.appendChild(link);
          var warm = new Image();
          warm.src = u;
        });
      })();
    </script>

    <style>
      :root {
        /* 深色兜底 —— 取代原先的橄榄绿纯色，刷新时不会出现整屏“绿布” */
        --app-base: #0c0f09;
        --bg-preview: url('/huba-blog-static/images/wallpaper-preview.webp');
        --bg-preview-custom: none;
      }

      /* ====== 背景层 — 三层：当前壁纸在上，缓存的自定义壁纸居中，6KB 本地预览图垫底 ======
         中间层加载失败/过慢时露出垫底层，欢迎层/加载幕永远不会变成纯黑。 */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        /* 刻意不给底色：Safari 26 会拿贴边 fixed 元素的 background-color 给浏览器 UI
           上色，本层铺满视口、上下都贴边，是个天然候选；但它只能有一个颜色，
           没法同时匹配壁纸顶边和底边，所以让它退出竞争（颜色交给 .chrome-tint 探针）。
           兜底色仍在 html 的 --app-base 上，视觉无变化。 */
        background-color: transparent;
        background-image:
          var(--bg-image, none),
          var(--bg-preview-custom, none),
          var(--bg-preview, none);
        background-size: cover, cover, cover;
        background-position: center, center, center;
        background-repeat: no-repeat, no-repeat, no-repeat;
        /* 关键：这一层绝不能淡入。
           毛玻璃（backdrop-filter）是“采样身后的背景”，这个背景就是本层。
           一旦本层 opacity < 1 地淡入，玻璃采到的就是一张正在变暗的图，
           表现就是“玻璃先深色、再变正常白色”。所以壁纸永远是满不透明度。 */
        pointer-events: none;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.16) 0%,
          rgba(0, 0, 0, 0.08) 30%,
          rgba(0, 0, 0, 0.04) 60%,
          rgba(0, 0, 0, 0.12) 100%
        );
        pointer-events: none;
      }

      /* ====== Safari 26 浏览器 UI 取色探针（真机「黑边」的正解） ======
         Safari 26 起，Apple 不再使用 <meta name="theme-color"> 给浏览器界面染色，
         改为**采样页面上某个元素的 background-color** 来决定顶部状态栏 / 底部地址栏的颜色：
           · 默认来源是 <body> 的 background-color；body 没有就退到 <html> 的；
             （Safari 15~18.6 读 theme-color，所以两个都留着。）
           · 但「贴边 + 至少 80% 宽 + 至少 3px 高」的 fixed / sticky 元素优先于 <body>。
         本项目 body 是透明的（壁纸由 body::before 铺满），壁纸层又是伪元素，
         于是 Safari 没有 body 底色可采，只能退到 <html> 的 #0c0f09 ——
         **那两条看起来像「浏览器没全屏」的近黑色边条就是这么来的**，跟
         viewport-fit=cover、安全区都无关（真机自检里 env 全是 0 也印证了这点）。
         解法：放两个只负责「被采样」的探针，一上一下贴着边缘，
         颜色由 useWallpaperEdge.js 采样壁纸对应边缘后写入 --bg-edge-top / -bottom。
         规范明确 visibility: hidden 仍在采样范围内，所以它们完全不可见、也不吃点击。
         桌面浏览器 / Android 上只是两个隐藏空 div，无任何副作用。 */
      .chrome-tint {
        position: fixed;
        left: 0;
        right: 0;
        width: 100%;
        height: 6px;              /* 规范要求 ≥ 3px */
        z-index: -4;              /* 比壁纸层(-2)还低，绝不遮挡任何内容 */
        visibility: hidden;       /* 不可见，但仍会被 Safari 采样 */
        pointer-events: none;
        background-color: var(--app-base);
      }
      #chrome-tint-top {
        top: 0;                   /* 规范：距顶 4px 以内 */
        background-color: var(--bg-edge-top, var(--app-base));
      }
      #chrome-tint-bottom {
        bottom: 0;                /* 规范：距底 3px 以内 */
        background-color: var(--bg-edge-bottom, var(--app-base));
      }

      /* ====== Welcome — 首次进入的问候层 ======
         设计要点：它不是「另一个世界」，而是**同一张壁纸的虚焦版**。
         揭开时只做一次「对焦」动作（虚焦归零 + 遮罩掀开），不换场景、不换色调。 */
      #apple-welcome {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        background-color: var(--app-base);
        transition: opacity 0.46s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0.46s cubic-bezier(0.22, 1, 0.36, 1);
        overflow: hidden;
        isolation: isolate;
      }
      /* 已访问过 → 首帧就不渲染，不再出现遮罩过程 */
      html.welcome-seen #apple-welcome {
        display: none;
      }

      /* 同一张壁纸做底，只做虚焦 + 轻微压暗（缓存壁纸失败时露出本地兜底图） */
      .welcome-bg {
        position: absolute;
        inset: -8%;
        z-index: 0;
        background-image:
          var(--bg-preview-custom, none),
          var(--bg-preview, none);
        background-size: cover, cover;
        background-position: center, center;
        background-repeat: no-repeat, no-repeat;
        filter: blur(26px) saturate(0.95) brightness(0.8);
        transform: scale(1.06);
        transition: filter 0.5s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: filter, transform;
        pointer-events: none;
      }
      /* 一层轻压暗，保证文字可读；刻意不重，让场景仍然看得见 */
      .welcome-scrim {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
          ellipse 95% 75% at 50% 45%,
          rgba(6, 9, 7, 0.16) 0%,
          rgba(6, 9, 7, 0.58) 100%
        );
        transition: opacity 0.5s ease;
        pointer-events: none;
      }
      /* 进入 = 对焦：虚焦归零、遮罩掀开 */
      #apple-welcome.done .welcome-bg {
        filter: blur(0px) saturate(1) brightness(1);
        transform: scale(1);
      }
      #apple-welcome.done .welcome-scrim {
        opacity: 0;
      }

      /* 问候语 —— 只有一个词，没有粒子、没有进度点、没有呼吸动画 */
      .welcome-core {
        position: relative;
        z-index: 2;
      }

      #welcome-word {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "PingFang SC", "Helvetica Neue", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        font-size: clamp(2.6rem, 8vw, 4.6rem);
        font-weight: 600;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.97);
        text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.35);
        transition: opacity 0.3s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.3s ease;
        will-change: opacity, transform, filter;
      }
      #welcome-word.out {
        opacity: 0;
        transform: translateY(-14px);
        filter: blur(8px);
      }
      #welcome-word.in {
        opacity: 0;
        transform: translateY(14px);
        filter: blur(8px);
      }
      #welcome-word.instant {
        transition: none;
      }
      /* 揭开时文字顺着「对焦」的方向散开 */
      #apple-welcome.done #welcome-word {
        opacity: 0;
        transform: translateY(-14px) scale(1.02);
        filter: blur(8px);
      }

      /* 玻璃按钮 —— 去掉脉冲呼吸，只保留一次淡入 */
      #welcome-btn {
        position: relative;
        z-index: 2;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.3s ease, border-color 0.3s ease;
        padding: 13px 52px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.38);
        border-radius: 40px;
        color: rgba(255, 255, 255, 0.94);
        font-size: 1.06rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
        pointer-events: none;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }
      #welcome-btn.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      #welcome-btn:hover {
        background: rgba(255, 255, 255, 0.24);
        border-color: rgba(255, 255, 255, 0.58);
        transform: translateY(-2px);
      }
      #welcome-btn:active {
        transform: scale(0.97);
        transition: transform 0.12s ease;
      }
      #welcome-btn:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.75);
        outline-offset: 3px;
      }

      .welcome-hint {
        position: relative;
        z-index: 2;
        margin: -18px 0 0;
        font-size: 0.76rem;
        letter-spacing: 0.14em;
        color: rgba(255, 255, 255, 0.5);
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      .welcome-hint.show {
        opacity: 1;
      }

      #apple-welcome.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #welcome-word,
        .welcome-bg,
        .welcome-scrim,
        .welcome-hint,
        #welcome-btn {
          transition-duration: 0.01s;
        }
      }

      /* ====== 加载幕已移除 ======
         曾经有一层 #boot-curtain（同一张壁纸 blur(26px) + 压暗 + 径向遮罩）
         用来遮 FOUC。但它每次打开/刷新都会先糊一层深色，观感很差，
         而且一旦揭幕逻辑失败就整屏卡住。现已整层删除：
         首屏不再有任何全屏遮罩，标题的可见性由 html.hero-in 单独控制
         （见 global.css 的首屏文字进场），不会出现"先黑后白"。 */

      /* ====== 全局首屏 ======
         #app 刻意「不做」整体淡入：任何祖先元素上的 opacity < 1 都会让
         后代的 backdrop-filter 立刻塌成深色，松手才变回正常白色。
         首屏的设计感由「逐元素的错落入场」承担（导航 / 标题 / 简介 / 按钮）。 */
      html {
        background-color: var(--app-base);
      }
      body {
        background-color: transparent;
      }
    </style>

  <body>
    <!-- SVG 滤镜 — iOS 26 液态玻璃：feTurbulence 由 JS 实时驱动 -->
    <svg style="position:absolute;width:0;height:0;pointer-events:none" aria-hidden="true">
      <defs>
        <!-- ═══ 动态液态玻璃 (JS 驱动 baseFrequency) ═══ -->
        <filter id="liquid-live" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence id="liquid-turb" type="fractalNoise" baseFrequency="0.014 0.016" numOctaves="4" seed="7" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="2" result="smooth"/>
          <feDisplacementMap in="SourceGraphic" in2="smooth" scale="18"
            xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <!-- ═══ 色差折射：R/G/B 通道分别偏移 → 边缘彩色分离 ═══ -->
        <filter id="liquid-chroma" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence id="chroma-turb" type="fractalNoise" baseFrequency="0.018 0.02" numOctaves="3" seed="3" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="2.5" result="smooth"/>
          <!-- R通道 (暖色偏移) -->
          <feDisplacementMap in="SourceGraphic" in2="smooth" scale="6"
            xChannelSelector="R" yChannelSelector="G" result="red-shift"/>
          <!-- 最终的色差混合 -->
          <feOffset in="red-shift" dx="1" dy="0" result="chroma"/>
        </filter>
        <!-- ═══ 静态液态玻璃 (无 JS 时降级) ═══ -->
        <filter id="liquid-static" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="5" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="1.5" result="smooth"/>
          <feDisplacementMap in="SourceGraphic" in2="smooth" scale="14"
            xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <!-- Welcome — 同一张壁纸的虚焦版，揭开时只做一次「对焦」 -->
    <div id="apple-welcome">
      <div class="welcome-bg" aria-hidden="true"></div>
      <div class="welcome-scrim" aria-hidden="true"></div>

      <div class="welcome-core">
        <h1 id="welcome-word">你好</h1>
      </div>

      <button id="welcome-btn" type="button">进入</button>
      <p class="welcome-hint">或按 Enter</p>
    </div>

    <div id="app"></div>

    <!-- Safari 26 的浏览器 UI 取色探针（不可见，只负责被采样）—— 见 head 里的说明 -->
    <div id="chrome-tint-top" class="chrome-tint" aria-hidden="true"></div>
    <div id="chrome-tint-bottom" class="chrome-tint" aria-hidden="true"></div>

    <script>
      (function () {
        var root = document.documentElement;

        // 已经看过问候页 → 完全跳过，连定时器都不启动
        if (root.classList.contains('welcome-seen')) return;
        try { localStorage.setItem('welcome_seen', '1'); } catch (e) {}

        var wrap = document.getElementById('apple-welcome');
        var el = document.getElementById('welcome-word');
        var btn = document.getElementById('welcome-btn');
        var hint = document.querySelector('.welcome-hint');

        // 只有两句：一次招呼 + 站名。不再堆 5 种语言，也不再有进度点。
        var words = ['你好', '胡巴的博客'];
        var DWELL = 520;   // 每句停留
        var FADE = 280;    // 交叉溶解时长
        var AUTO_ENTER = 800; // 说完自动揭开，避免“卡住”

        var step = 0;
        var timers = [];
        var dismissed = false;

        function push(fn, ms) {
          timers.push(setTimeout(fn, ms));
        }

        function enter() {
          if (dismissed) return;
          dismissed = true;
          timers.forEach(clearTimeout);
          timers = [];
          wrap.classList.add('done');
          wrap.setAttribute('aria-hidden', 'true');
          wrap.style.pointerEvents = 'none';
          push(function () {
            wrap.style.display = 'none';
          }, 520);
          // 揭开的同时让首页 hero 文字错落进场（等 webfont 就绪，保证
          // 露出来的一开始就是白色渐变的最终样式）
          revealHero(280);
          // 解锁音频自动播放
          try {
            var audio = new Audio();
            audio.volume = 0;
            audio.play().then(function () { audio.pause(); }).catch(function () {});
          } catch (e) {}
        }

        // hero 文字进场开关：尽量等 webfont 就绪（最多 1.2s），避免渐变标题先以深色渲染
        var fontsSettled = Promise.race([
          (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve(),
          new Promise(function (r) { setTimeout(r, 1200); })
        ]);
        function revealHero(delay) {
          push(function () {
            fontsSettled.then(function () { root.classList.add('hero-in'); });
          }, delay || 0);
        }

        function cycle() {
          if (dismissed) return;
          step++;
          if (step >= words.length) {
            // 说完了 → 自动揭开
            push(enter, AUTO_ENTER);
            return;
          }

          el.classList.add('out');
          push(function () {
            if (dismissed) return;
            el.textContent = words[step];
            // 无过渡落到“入场起始位”，再回到常态
            el.classList.add('instant', 'in');
            el.classList.remove('out');
            void el.offsetWidth;
            el.classList.remove('instant');
            requestAnimationFrame(function () {
              if (dismissed) return;
              el.classList.remove('in');
            });
            push(cycle, DWELL);
          }, FADE);
        }

        push(cycle, DWELL);
        push(function () {
          if (dismissed) return;
          btn.classList.add('show');
          hint.classList.add('show');
        }, 260);

        btn.addEventListener('click', enter);

        document.addEventListener('keydown', function (e) {
          if (dismissed) return;
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
            e.preventDefault();
            enter();
          }
        });

        // 离开时不留下悬挂的定时器
        window.addEventListener('pagehide', function () {
          dismissed = true;
          timers.forEach(clearTimeout);
        });

        // ===== 硬兜底：无论轮播定时器是否被节流/挂起，欢迎层最多停留 6s =====
        window.addEventListener('load', function () {
          setTimeout(function () { if (!dismissed) enter(); }, 3500);
        });
        setTimeout(function () { if (!dismissed) enter(); }, 6000);
      })();
    </script>

    <script>
      (function () {
        var root = document.documentElement;
        // 加载幕已整层删除（见上方注释）。这段现在只做一件事：
        // 给「刷新/回访」路径打上首屏文字进场开关 html.hero-in。
        // 首次访问由欢迎层在揭幕时自己打上，这里直接跳过。
        if (!root.classList.contains('welcome-seen')) return;

        // 等 webfont 就绪再放行，避免渐变标题先以深色渲染（最多等 1.2s，慢网络不拖久）。
        // 放在内联脚本里而不是等 main.js：模块包要下载+执行，会让首屏文字多藏一会儿。
        var fontsSettled = Promise.race([
          (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve(),
          new Promise(function (r) { setTimeout(r, 1200); })
        ]);
        fontsSettled.then(function () { root.classList.add('hero-in'); });

        // 硬兜底：module 也挂了也不会一直藏着（global.css 里同源规则 + main.js 的 3s 兜底）
        setTimeout(function () { root.classList.add('hero-in'); }, 1800);
      })();
    </script>

    <!-- ===== 真机自检面板 — 只在 URL 带 ?diag=1 时出现 =====
         安全区在桌面浏览器恒为 0，没法在电脑上验证，只能真机看。
         把关键数字直接画在页面上，截一张图就能判断：
         ① viewport 标签里有没有 viewport-fit=cover（没有 = 手机还在用缓存的旧 HTML）
         ② CSS 里的 --safe-top 存不存在（不存在 = CSS 也是旧的）
         ③ 设备是否真的上报了非零安全区（env(top) 实测）
         ④ 页面是不是「装到主屏」的独立模式
         平时不显示，避免干扰正常浏览。 -->
    <script>
      (function () {
        // 2026-09-15：数据已经拿齐（结论见 useWallpaperEdge.js 顶部注释），
        // 所以收回成「只在 ?diag=1 时出现」，不再自动弹出。
        if (!/[?&]diag=1/.test(location.search)) return;

        function build() {
          // 用探针元素把 env() 真正解析出来（直接读自定义属性只能拿到原始 token）
          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
            'padding-top:env(safe-area-inset-top, 0px);' +
            'padding-bottom:env(safe-area-inset-bottom, 0px);';
          document.body.appendChild(probe);
          var ps = getComputedStyle(probe);
          var rootCS = getComputedStyle(document.documentElement);
          var vpMeta = document.querySelector('meta[name="viewport"]');
          var gap = window.screen.height - window.innerHeight;
          var safeTop = parseFloat(ps.paddingTop) || 0;
          var safeBottom = parseFloat(ps.paddingBottom) || 0;
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            navigator.standalone === true;
          var inFrame = false;
          try { inFrame = window.top !== window.self; } catch (e) { inFrame = true; }

          var rows = [
            ['自检版本', 'v6 · 安全区 + 浏览器 UI 取色'],
            ['viewport 标签', vpMeta ? vpMeta.getAttribute('content') : '(标签缺失)'],
            ['env(top) 实测', ps.paddingTop],
            ['env(bottom) 实测', ps.paddingBottom],
            ['CSS --safe-top', rootCS.getPropertyValue('--safe-top').trim() || '(CSS 是旧版)'],
            [
              '安全区是否可用',
              safeTop > 0 || safeBottom > 0
                ? '可用'
                : '不可用 ✕ 浏览器把网页缩进了安全区，顶部/底部那两条画不到',
            ],
            ['innerHeight', window.innerHeight + 'px'],
            ['screen.height', window.screen.height + 'px'],
            ['高度差', gap + 'px（就是被浏览器占掉的）'],
            ['innerWidth', window.innerWidth + 'px'],
            ['screen.width', window.screen.width + 'px'],
            ['dpr', String(window.devicePixelRatio)],
            ['独立模式', standalone ? '是' : '否'],
            ['在 iframe 里', inFrame ? '是 ✕ 这会让安全区失效' : '否'],
            [
              '取色探针 · 顶',
              rootCS.getPropertyValue('--bg-edge-top').trim() || '(还没算出来)',
            ],
            [
              '取色探针 · 底',
              rootCS.getPropertyValue('--bg-edge-bottom').trim() || '(还没算出来)',
            ],
            [
              'theme-color',
              (document.querySelector('meta[name="theme-color"]') || {}).content || '(无)',
            ],
            ['UA', navigator.userAgent],
          ];

          var box = document.createElement('div');
          box.style.cssText =
            'position:fixed;left:10px;right:10px;z-index:2147483647;' +
            'top:calc(78px + env(safe-area-inset-top, 0px));padding:12px 14px;border-radius:14px;' +
            'background:rgba(6,10,4,.9);color:#fff;word-break:break-all;' +
            'font:12px/1.75 ui-monospace,Menlo,Consolas,monospace;' +
            'border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 30px rgba(0,0,0,.4);';
          var html =
            '<div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:8px">' +
            '<b style="font-size:13px">真机自检</b>' +
            '<span data-diag-close style="cursor:pointer;opacity:.7">关闭 ✕</span></div>' +
            '<div style="opacity:.55;margin-bottom:6px">把这一屏截图发我</div>';
          rows.forEach(function (r) {
            html += '<div><span style="opacity:.55">' + r[0] + '：</span>' + r[1] + '</div>';
          });
          if (!standalone) {
            html +=
              '<div style="margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.22);line-height:1.7">' +
              '上下那两条是<b>浏览器自己的界面</b>（状态栏 + 地址栏），网页画不进去。<br>' +
              '现在改成让它们<b>采样页面底色</b>，跟着壁纸走（见上面两个取色探针）。<br>' +
              '想要彻底没有它们：<b>用 Safari 打开本页 → 分享 → 添加到主屏幕</b>，再从桌面图标进去。' +
              '</div>';
          }
          box.innerHTML = html;
          document.body.appendChild(box);
          box.querySelector('[data-diag-close]').onclick = function () {
            box.remove();
            probe.remove();
          };
        }

        // CSS 是 Vite 注入的，必须等页面解析完再量，否则可能读到还没生效的旧值。
        // 不用 window.load：那张全屏壁纸很大，load 可能被拖很久，面板会迟迟不出现。
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { setTimeout(build, 1000); });
        } else {
          setTimeout(build, 300);
        }
      })();
    </script>

  </body>
</html>
